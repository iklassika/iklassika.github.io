name: Update Cydia repo metadata

# Runs on every push to main and can also be started manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow commits generated files back to the repository.
permissions:
  contents: write

# Do not let two runs race each other over the same branch.
concurrency:
  group: update-repo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    # Ignore commits made by this workflow itself (e.g. when a PAT is used).
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Regenerate Packages, compressed indexes and Release
        run: bash scripts/generate-repo.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Metadata is already up to date — nothing to commit."
            exit 0
          fi

          git add -- Packages Packages.gz Packages.bz2 Packages.xz Release
          git commit -m "chore: regenerate repo metadata [skip ci]"
          git push
