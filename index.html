<!DOCTYPE html SYSTEM "about:legacy-compat">
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>iKlassika</title>
        <link rel="stylesheet" type="text/css" href="/cydiaui/styles.css">
        <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="format-detection" content="telephone=no">
        <script type="text/javascript" src="/cydiaui/style.js"></script>
        <script type="text/javascript" src="/cydiaui/menes.js"></script>
        <script type="text/javascript" src="/cydiaui/fastclick.js"></script>
    </head>
    <body class="pinstripe">
        <panel>
            <div style="margin:9px;padding:6px 16px">
                <img height="60" width="60" style="position:absolute;vertical-align:middle;-webkit-border-radius: 9px;border-radius: 9px;" src="/cydiaui/icons/iklassika.png">
                <div style="padding-top: 6px;margin-left: 70px;text-align: center;display: block;height: 70px;">
                    <span style="font-size:20px" id="welcome">Это репозиторий iKlassika</span><br><span style="font-size:17px" id="by"><a>для Cydia</a></span>
                </div>
            </div>
            <fieldset style="background-color:rgba(255,255,255,0.5)">
                <a href="https://iklassika.ru" class="left">
                    <img class="icon" src="/cydiaui/icons/iklassika.png" style="-webkit-border-radius: 6px;border-radius: 6px;">
                    <div>
                        <div>
                            <label>
                                <p>Сайт</p>
                            </label>
                        </div>
                    </div>
                </a>
                <a href="https://t.me/iklassika" class="right">
                    <img class="icon" src="/cydiaui/icons/telegram.png" style="-webkit-border-radius: 6px;border-radius: 6px;">
                    <div>
                        <div>
                            <label>
                                <p>Телеграм</p>
                            </label>
                        </div>
                    </div>
                </a>
            </fieldset>
            <fieldset style="background-color:rgba(255,255,255,0.5)">
                <a href="cydia://url/https://cydia.saurik.com/api/share#?source=http://iklassika.github.io/">
                    <img class="icon" src="/cydiaui/icons/cydia.png" style="-webkit-border-radius: 6px;border-radius: 6px;">
                    <div>
                        <div>
                            <label>
                                <p>Сайт</p>
                            </label>
                        </div>
                    </div>
                </a>
            </fieldset>
            <block>
                <p>Этот репозиторий просвещен iKlassika.</p>
            </block>
        </panel>
    </body>
</html>
